<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RoboFight – Programmiere deinen Roboter</title>
  <meta name="description" content="Lernspiel: Roboter mit Python programmieren, Missionen meistern und in der 3D-Arena kämpfen.">
  <meta name="theme-color" content="#0f1530">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script src="vendor/codemirror/lib/codemirror.js"></script>
  <script src="vendor/codemirror/mode/python/python.js"></script>
  <script src="vendor/codemirror/addon/edit/matchbrackets.js"></script>
  <script src="vendor/codemirror/addon/edit/closebrackets.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.min.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">
      <img src="img/icon.svg" alt="" width="32" height="32">
      <span>Robo<b>Fight</b></span>
    </a>
    <nav class="nav"></nav>
    <div class="player-stats">
      <span class="user-pills"></span>
      <span class="pill engine" id="engine-status" data-status="loading"><i></i><span class="label">Python lädt …</span></span>
    </div>
  </header>

  <main id="app"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
